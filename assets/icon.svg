<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bastion">
	<title>Bastion</title>
	<!-- Rounded card: the near-white plate the mark sits on. -->
	<rect x="0" y="0" width="512" height="512" rx="76" fill="#f7f8fa"/>

	<!--
		A gate through a wall, filled.

		One solid silhouette rather than a drawing: a dark opening between two
		dark piers is the only shape that still reads at 32 px, where a stroke
		of a few pixels turns to grey.

		The two arches share their spring line at y 256 — the opening is
		concentric with the crown — so the band is 56 px wide everywhere: at the
		apex, down both piers, and into the base. Nothing is thicker than
		anything else, which is what keeps a fill this heavy from looking clumsy.
	-->
	<path d="M100 412V256A156 156 0 0 1 412 256V412H356V256A100 100 0 0 0 156 256V412Z" fill="#0b0d10"/>
</svg>
